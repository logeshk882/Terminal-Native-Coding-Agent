[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmca"
version = "0.1.0"
description = "Terminal-Native Coding Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tmca = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

